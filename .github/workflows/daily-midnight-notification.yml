name: Daily midnight love notification

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a one-time test using Day 1's teaser"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-midnight-love-notification
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send today's teaser
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode && 'true' || 'false' }}
        run: node scripts/send-daily-teaser.mjs
